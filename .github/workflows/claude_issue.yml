name: Issue Triage
on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}
            TITLE: ${{ github.event.issue.title }}
            BODY: ${{ github.event.issue.body }}
            AUTHOR: ${{ github.event.issue.user.login }}

            Analyze this new issue and:
            1. Determine if it's a bug report, feature request, or question
            2. Assess priority (critical, high, medium, low)
            3. Suggest appropriate labels
            4. Check if it duplicates existing issues

            Use the gh CLI to interact with GitHub:
            - `gh issue view ${{ github.event.issue.number }}` to view the issue
            - `gh issue list --search "query" --state all` to find similar issues
            - `gh label list` to see available labels

            Based on your analysis, add the appropriate labels using:
            `gh issue edit ${{ github.event.issue.number }} --add-label "label1" --add-label "label2"`

            If it appears to be a duplicate, post a comment mentioning the original issue using:
            `gh issue comment ${{ github.event.issue.number }} --body "..."`

          claude_args: |
            --model claude-sonnet-5
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh label list:*),Bash(gh issue edit:*),Bash(gh issue comment:*)"
